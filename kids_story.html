<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Star's Journey</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            user-select: none;
        }

        #story-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Stars in the background */
        .bg-star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: var(--opacity);
        }

        @keyframes twinkle {
            0%, 100% { transform: scale(1); opacity: var(--opacity); }
            50% { transform: scale(1.5); opacity: 1; }
        }

        /* The Main Character */
        #hero {
            position: absolute;
            font-size: 80px;
            transition: all 2s ease-in-out;
            filter: drop-shadow(0 0 15px gold);
            z-index: 10;
            cursor: pointer;
        }

        /* Scenery Elements */
        .cloud {
            position: absolute;
            font-size: 100px;
            opacity: 0.8;
            transition: transform 3s linear;
        }

        .moon {
            position: absolute;
            font-size: 120px;
            right: 10%;
            top: 15%;
            filter: drop-shadow(0 0 20px yellow);
            transition: transform 2s ease;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 300px solid #2c3e50;
            z-index: 5;
        }

        /* UI Elements */
        #narration-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 24px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: translateX(-50%) scale(0.5); opacity: 0; }
            to { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        #start-screen, #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 41, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            text-align: center;
        }

        h1 {
            font-size: 60px;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        button:hover {
            transform: scale(1.1);
            background: #ff5252;
        }

        .hidden {
            display: none !important;
        }

        /* Animations for scenes */
        .bounce {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .spin {
            animation: spin 3s infinite linear;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="story-container">
        <!-- Background Stars generated by JS -->
        
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>⭐ The Little Star's Journey ⭐</h1>
            <p style="font-size: 20px; margin-bottom: 30px; max-width: 600px;">
                Help Twinkle the Star find his way home across the night sky!
            </p>
            <button onclick="startStory()">Start Adventure</button>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="hidden">
            <h1>🌟 Home Sweet Home! 🌟</h1>
            <p style="font-size: 24px; margin-bottom: 30px;">
                Twinkle made it safely to the moon family!<br>Great job!
            </p>
            <button onclick="location.reload()">Play Again</button>
        </div>

        <!-- Story Elements -->
        <div id="scenery-layer"></div>
        <div id="hero">⭐</div>
        <div id="narration-box"></div>
    </div>

    <script>
        const container = document.getElementById('story-container');
        const hero = document.getElementById('hero');
        const narrationBox = document.getElementById('narration-box');
        const sceneryLayer = document.getElementById('scenery-layer');
        
        let currentScene = 0;

        // Generate Background Stars
        function createBackgroundStars() {
            for(let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.classList.add('bg-star');
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 80 + '%';
                star.style.width = (Math.random() * 3 + 2) + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--opacity', Math.random());
                container.appendChild(star);
            }
        }

        // Create Scenery Elements
        function createScenery() {
            // Moon
            const moon = document.createElement('div');
            moon.classList.add('moon');
            moon.innerHTML = '🌙';
            moon.id = 'moon-target';
            sceneryLayer.appendChild(moon);

            // Clouds
            const cloud1 = document.createElement('div');
            cloud1.classList.add('cloud');
            cloud1.innerHTML = '☁️';
            cloud1.style.left = '20%';
            cloud1.style.top = '40%';
            cloud1.id = 'cloud1';
            sceneryLayer.appendChild(cloud1);

            const cloud2 = document.createElement('div');
            cloud2.classList.add('cloud');
            cloud2.innerHTML = '☁️';
            cloud2.style.left = '60%';
            cloud2.style.top = '20%';
            cloud2.style.transform = 'scale(0.8)';
            cloud2.id = 'cloud2';
            sceneryLayer.appendChild(cloud2);

            // Mountains
            for(let i=0; i<5; i++) {
                const mountain = document.createElement('div');
                mountain.classList.add('mountain');
                mountain.style.left = (i * 20 - 5) + '%';
                mountain.style.zIndex = 4;
                sceneryLayer.appendChild(mountain);
            }
        }

        function showNarration(text, duration, callback) {
            narrationBox.innerText = text;
            narrationBox.style.display = 'block';
            
            setTimeout(() => {
                narrationBox.style.display = 'none';
                if(callback) callback();
            }, duration);
        }

        function moveHero(x, y, rotation = 0, scale = 1) {
            hero.style.left = x + '%';
            hero.style.top = y + '%';
            hero.style.transform = `rotate(${rotation}deg) scale(${scale})`;
        }

        const scenes = [
            {
                action: () => {
                    moveHero(10, 80, 0, 1);
                    hero.classList.add('bounce');
                    showNarration("Meet Twinkle! He is a little star who loves to explore.", 4000, nextScene);
                }
            },
            {
                action: () => {
                    hero.classList.remove('bounce');
                    moveHero(30, 60, 45, 1.2);
                    showNarration("Twinkle wants to visit the big friendly Moon.", 3000, nextScene);
                }
            },
            {
                action: () => {
                    moveHero(45, 45, 0, 1);
                    const cloud1 = document.getElementById('cloud1');
                    cloud1.style.transform = "translateX(50px)";
                    showNarration("Oh no! A fluffy cloud block! Let's go around it.", 3500, nextScene);
                }
            },
            {
                action: () => {
                    moveHero(55, 30, -45, 1.1);
                    const cloud2 = document.getElementById('cloud2');
                    cloud2.style.transform = "scale(0.8) translateY(-20px)";
                    showNarration("Wheee! Flying high above the clouds!", 3000, nextScene);
                }
            },
            {
                action: () => {
                    moveHero(75, 20, 0, 1.3);
                    hero.classList.add('spin');
                    const moon = document.getElementById('moon-target');
                    moon.style.transform = "scale(1.2) rotate(20deg)";
                    showNarration("Look! The Moon is waving hello!", 3500, nextScene);
                }
            },
            {
                action: () => {
                    hero.classList.remove('spin');
                    moveHero(82, 18, 0, 1);
                    showNarration("Twinkle is home safe. Goodnight, Twinkle!", 4000, endStory);
                }
            }
        ];

        function nextScene() {
            currentScene++;
            if(currentScene < scenes.length) {
                setTimeout(scenes[currentScene].action, 500);
            }
        }

        function startStory() {
            document.getElementById('start-screen').classList.add('hidden');
            createBackgroundStars();
            createScenery();
            
            // Initial position
            hero.style.transition = "all 0s";
            moveHero(10, 80);
            hero.style.transition = "all 2s ease-in-out";
            
            setTimeout(() => {
                scenes[0].action();
            }, 1000);
        }

        function endStory() {
            document.getElementById('end-screen').classList.remove('hidden');
        }

        // Initialize
        createBackgroundStars();
        createScenery();
        // Hide scenery initially until start
        sceneryLayer.style.opacity = '0';
        hero.style.opacity = '0';
        
        document.getElementById('start-screen').addEventListener('click', (e) => {
            if(e.target.tagName !== 'BUTTON') return;
            sceneryLayer.style.opacity = '1';
            hero.style.opacity = '1';
        });

    </script>
</body>
</html>
